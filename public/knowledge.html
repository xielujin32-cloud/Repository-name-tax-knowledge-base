<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#175cd3" />
    <meta name="description" content="税策库：查询全国通用税种公式、税率、适用条件与官方依据。" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/knowledge.css" />
    <title>税策库｜手机税务知识库</title>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="税策库首页"><span>税</span><strong>税策库</strong></a>
      <button id="install-app" class="install-app" hidden>添加到桌面</button>
    </header>
    <main>
      <section class="hero">
        <p>已核验政策 · 官方依据 · 持续更新</p>
        <h1>查政策，也查实务规则</h1>
        <span>优先展示已完成官方 Evidence 与 Level 3 审核的政策</span>
        <form id="search-form" class="search-box" role="search">
          <label for="search-input" class="sr-only">搜索税种或业务场景</label>
          <input id="search-input" type="search" autocomplete="off" placeholder="例如：个人所得税、工资、经营所得" />
          <button type="submit">查询</button>
        </form>
      </section>

      <section class="content-section policy-search-section" aria-labelledby="policy-search-heading">
        <div class="section-title"><div><h2 id="policy-search-heading">可信政策检索</h2><p id="policy-result-note">默认只显示已核验的现行有效或部分有效政策。</p></div></div>
        <form id="policy-search-form" class="policy-search-form" role="search">
          <label class="policy-field policy-field-wide">关键词或文号
            <input id="policy-query" type="search" autocomplete="off" placeholder="例如：增值税、国家税务总局公告〔2026〕1号" />
          </label>
          <label class="policy-field">精确文号
            <input id="policy-document-no" type="search" autocomplete="off" placeholder="例如：国家税务总局公告2026年第1号" />
          </label>
          <label class="policy-field">税种
            <input id="policy-tax-category" list="policy-tax-category-options" placeholder="例如：增值税" />
            <datalist id="policy-tax-category-options"><option value="增值税"></option><option value="个人所得税"></option><option value="企业所得税"></option><option value="消费税"></option></datalist>
          </label>
          <label class="policy-field">效力状态
            <select id="policy-status"><option value="">现行有效（默认）</option><option value="effective">有效</option><option value="partially_effective">部分有效</option><option value="repealed">已废止（已核验）</option><option value="expired">已失效（已核验）</option><option value="all">全部已核验状态</option></select>
          </label>
          <label class="policy-field">发布机关
            <input id="policy-authority" placeholder="例如：国家税务总局" />
          </label>
          <label class="policy-field">来源
            <input id="policy-source" placeholder="例如：国家税务总局政策法规库" />
          </label>
          <label class="policy-field">地区
            <input id="policy-region" placeholder="例如：全国、北京市" />
          </label>
          <label class="policy-field">发布日期起
            <input id="policy-published-from" type="date" />
          </label>
          <label class="policy-field">发布日期止
            <input id="policy-published-to" type="date" />
          </label>
          <label class="policy-field">施行日期起
            <input id="policy-effective-from" type="date" />
          </label>
          <label class="policy-field">施行日期止
            <input id="policy-effective-to" type="date" />
          </label>
          <button type="submit" class="policy-search-submit">检索已核验政策</button>
        </form>
        <div id="policy-list" class="policy-list" aria-live="polite"></div>
      </section>

      <section class="content-section" aria-labelledby="tax-type-heading">
        <div class="section-title"><h2 id="tax-type-heading">热门税种</h2><button id="clear-filter" class="text-button" hidden>查看全部</button></div>
        <div id="tax-types" class="tax-types" aria-live="polite"></div>
      </section>

      <section class="content-section results-section" aria-labelledby="results-heading">
        <div class="section-title"><div><h2 id="results-heading">常用知识卡片</h2><p id="result-note">以下内容适用于全国通用基础规则。</p></div></div>
        <div id="card-list" class="card-list" aria-live="polite"></div>
      </section>
    </main>
    <footer>内容用于知识查询与辅助测算；正式申报请以主管税务机关和电子税务局口径为准。</footer>

    <dialog id="card-dialog" class="card-dialog" aria-labelledby="detail-title">
      <article id="card-detail"></article>
    </dialog>
    <dialog id="policy-dialog" class="card-dialog" aria-labelledby="policy-detail-title">
      <article id="policy-detail"></article>
    </dialog>
    <script type="module" src="/knowledge.js"></script>
  </body>
</html>
